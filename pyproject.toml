[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "xamxam"
version = "0.1.0"
description = "Narration scientifique pour les langues nationales du Sénégal : correction de la prononciation des termes scientifiques avant synthèse vocale."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ialim0" }]
keywords = ["tts", "wolof", "senegal", "education", "kvicc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sympy>=1.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Provider Amazon Bedrock : seul composant qui dépend du SDK AWS (image Docker de production).
bedrock = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xamxam"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
# Le français utilise légitimement des caractères Unicode « ambigus » (’, ×, −…).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Fichier de données : une phrase par ligne, les couper nuirait à la relecture.
"tools/phrases_benchmark_100.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Avertissement interne à Starlette, sans effet sur nos tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]
