# Test local : image construite depuis le Dockerfile, certificat interne de Caddy.
#   cd deploy/aws
#   export XAMXAM_IMAGE=xamxam-bot:local XAMXAM_DOMAIN=localhost \
#          XAMXAM_HTTP_PORT=8080 XAMXAM_HTTPS_PORT=8443 \
#          XAMXAM_SECRETS_PATH="$PWD/.local/secrets" XAMXAM_CACHE_PATH="$PWD/.local/cache"
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait
#   curl -k https://localhost:8443/health
# Les dossiers .local/secrets (fichiers en mode 400) et .local/cache doivent appartenir à
# l'UID 10001 ; voir docs/deploiement-aws.md.
services:
  bot:
    build:
      context: ../..
    # Docker installé par snap (Ubuntu) refuse no-new-privileges (confinement AppArmor) :
    # option retirée pour le test local seulement, elle reste active en production.
    security_opt: !reset []
  caddy:
    environment:
      CADDY_EXTRA_GLOBAL_OPTIONS: local_certs
